<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7ed">
  <meta name="description" content="合成大白快乐游戏，一个零依赖、可替换图片与音效的网页版合成游戏。">
  <title>合成大白快乐游戏</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='24' fill='%23ff7f91'/%3E%3Cpath d='M34 12c8-8 15-4 16-2-4 6-9 8-16 7z' fill='%235dc27d'/%3E%3Ccircle cx='24' cy='31' r='3' fill='%23543d42'/%3E%3Ccircle cx='40' cy='31' r='3' fill='%23543d42'/%3E%3Cpath d='M25 41c5 5 10 5 15 0' fill='none' stroke='%23543d42' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-label="合成大白快乐游戏">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">●</span>
        <div>
          <h1>合成大白快乐游戏</h1>
          <p>同样大小，碰在一起就会长大</p>
        </div>
      </div>
      <div class="tools">
        <button class="icon-button" id="soundButton" type="button" aria-label="关闭音效" title="音效开关">
          <span id="soundIcon" aria-hidden="true">♪</span>
        </button>
        <button class="restart-button" id="restartButton" type="button">重新开始</button>
      </div>
    </header>

    <section class="score-row" aria-label="游戏数据">
      <div class="score-card score-card-main">
        <span>本局分数</span>
        <strong id="scoreValue">0</strong>
      </div>
      <div class="score-card">
        <span>最高记录</span>
        <strong id="bestValue">0</strong>
      </div>
      <div class="next-card">
        <span>下一个</span>
        <canvas id="nextPreview" width="144" height="144" aria-label="下一个角色预览"></canvas>
      </div>
    </section>

    <section class="game-frame" id="gameFrame">
      <div class="frame-glow frame-glow-left" aria-hidden="true"></div>
      <div class="frame-glow frame-glow-right" aria-hidden="true"></div>
      <canvas
        id="gameCanvas"
        width="800"
        height="1200"
        tabindex="0"
        aria-label="游戏区域，按住并左右拖动，松开投放"
      ></canvas>

      <div class="danger-label" id="dangerLabel" aria-hidden="true">危险</div>

      <div class="game-over-overlay" id="gameOverOverlay" aria-hidden="true">
        <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
          <canvas id="resultPreview" width="256" height="256" aria-hidden="true"></canvas>
          <p class="eyebrow">本局结束</p>
          <h2 id="resultTitle">差一点就合成了</h2>
          <p class="result-score"><strong id="finalScore">0</strong> 分</p>
          <p class="result-note" id="resultNote">再试一次，空间就是分数。</p>
          <button class="primary-button" id="playAgainButton" type="button">再玩一局</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p id="controlHint">按住拖动瞄准，松开投放</p>
      <div class="legend" id="levelLegend" aria-label="合成顺序"></div>
    </footer>

    <div class="sr-only" id="liveRegion" aria-live="polite"></div>
  </main>

  <noscript>这个游戏需要启用 JavaScript。</noscript>
  <script src="game.js"></script>
</body>
</html>
